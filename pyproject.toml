[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "configarr"
version = "0.2.0"
description = "Configuration manager for Radarr, Sonarr, Prowlarr, Bazarr, and SABnzbd"
requires-python = ">=3.12"
dependencies = [
    "click>=8.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "requests>=2.28",
    "rich>=13.0",
]

[project.scripts]
configarr = "configarr.__main__:main"

[project.optional-dependencies]
test = ["pytest>=8.0", "responses>=0.25"]

[tool.setuptools.packages.find]
where = ["."]
include = ["configarr*"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Strong default ruleset enforced by the CI lint gate (nix/checks/ruff.nix).
# pycodestyle/pyflakes baseline plus import sorting, pyupgrade, bugbear,
# simplify, ruff-specific, pathlib, return, and comprehension lints.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PTH", "RET", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
