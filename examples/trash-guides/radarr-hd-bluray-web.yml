# TRaSH-Guides adaptation: Radarr "HD Bluray + WEB" quality profile.
#
# Generated from the TRaSH-Guides data (https://trash-guides.info,
# https://github.com/TRaSH-Guides/Guides, MIT-licensed JSON) and translated into
# the configarr schema. Custom-format specifications are copied verbatim; scores
# are each format's TRaSH `default` score.
#
# Covers WEBDL 1080p and Bluray 720p/1080p, prefers higher-quality release-group
# tiers, and rejects unwanted sources (BR-DISK, LQ, x265 HD transcodes, ...) with
# large negative scores. See: https://trash-guides.info/Radarr/radarr-setup-quality-profiles/#hd-bluray-web
#
# Set RADARR_API_KEY in a .env beside your configarr.yml, adjust base_url, then:
#   configarr --config examples/trash-guides/radarr-hd-bluray-web.yml --service radarr

