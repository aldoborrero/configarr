# TRaSH-Guides adaptation: Sonarr "WEB-2160p (Alternative)" quality profile.
#
# Generated from the TRaSH-Guides data (https://github.com/TRaSH-Guides/Guides,
# MIT-licensed JSON) and translated into the configarr schema. Custom-format
# specifications are copied verbatim; scores are each format's TRaSH `default`
# score. The standard Unwanted Formats set is added at negative scores.
#
# Reference: https://trash-guides.info/Sonarr/sonarr-setup-quality-profiles/#web-2160p
#
# TRaSH's cutoff for this profile is a quality *group*; configarr resolves
# cutoffs by individual quality name, so it is mapped to WEBDL-2160p here.
#
# Set SONARR_API_KEY in a .env beside your configarr.yml, adjust base_url, then:
#   configarr --config examples/trash-guides/sonarr/web-2160p-alternative.yml --service sonarr

sonarr:
  instances:
    main:
      base_url: http://localhost:8989
      api_key: ${SONARR_API_KEY}
      custom_formats:
        definitions:
          Repack/Proper:
            specifications:
              - name: Repack/Proper/Rerip
                implementation: ReleaseTitleSpecification
                fields:
                  value: \b(Repack|Proper|Rerip)\b
              - name: Not Higher Version Repack/Proper
                implementation: ReleaseTitleSpecification
                negate: true
                fields:
                  value: \b((repack|proper)[23])\b|\bREAL\.(REAL\.)?(PROPER|REPACK)\b
          Repack2:
            include_when_renaming: true
            specifications:
              - name: Repack/Proper 2 or REAL.PROPER/REPACK
                implementation: ReleaseTitleSpecification
                fields:
                  value: \b((repack|proper)2)\b|\b(REAL\.(PROPER|REPACK))\b
              - name: Not Repack/Proper 3
                implementation: ReleaseTitleSpecification
                negate: true
                fields:
                  value: \b((repack|proper)3)\b|\bREAL\.(REAL\.)(PROPER|REPACK)\b
          Repack3:
            include_when_renaming: true
            specifications:
              - name: Repack/Proper 3 or REAL.REAL.PROPER/REPACK
                implementation: ReleaseTitleSpecification
                fields:
                  value: \b((repack|proper)3)\b|\b(REAL\.REAL\.(PROPER|REPACK))\b
