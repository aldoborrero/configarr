# TRaSH-Guides quality definitions (sizes): Radarr "Movie (default)".
#
# Generated from the TRaSH-Guides data (https://github.com/TRaSH-Guides/Guides,
# MIT-licensed JSON). Sets the min / max / preferred size (MB per minute) for
# each quality. Quality definitions are instance-level, so use the scheme that
# matches your primary profile — this one pairs with the HD/UHD Bluray + WEB and Remux + WEB profiles.
#
# Merge the `radarr:` block into your configarr.yml, or run standalone:
#   configarr --config examples/trash-guides/radarr/quality-definitions-movie.yml --service radarr

radarr:
  instances:
    main:
      base_url: http://localhost:7878
      api_key: ${RADARR_API_KEY}
      profiles:
        quality_definitions:
          HDTV-720p:
            min: 17.1
            max: 2000
            preferred: 1999
          WEBDL-720p:
            min: 12.5
            max: 2000
            preferred: 1999
          WEBRip-720p:
