# TRaSH-Guides quality definitions (sizes): Radarr "SQP UHD".
#
# Generated from the TRaSH-Guides data (https://github.com/TRaSH-Guides/Guides,
# MIT-licensed JSON). Sets the min / max / preferred size (MB per minute) for
# each quality. Quality definitions are instance-level, so use the scheme that
# matches your primary profile — this one pairs with the SQP UHD/Bluray profiles (SQP-1 2160p, SQP-2).
#
# Merge the `radarr:` block into your configarr.yml, or run standalone:
#   configarr --config examples/trash-guides/radarr/quality-definitions-sqp-uhd.yml --service radarr

radarr:
  instances:
    main:
      base_url: http://localhost:7878
      api_key: ${RADARR_API_KEY}
      profiles:
        quality_definitions:
          WEBDL-1080p:
            min: 12.5
            max: 2000
            preferred: 1999
          WEBRip-1080p:
            min: 12.5
            max: 2000
            preferred: 1999
          Remux-1080p:
            min: 136.8
            max: 2000
            preferred: 1999
          HDTV-2160p:
            min: 85
            max: 2000
            preferred: 1999
          WEBDL-2160p:
            min: 34.5
            max: 2000
            preferred: 1999
          WEBRip-2160p:
            min: 34.5
            max: 2000
            preferred: 1999
          Bluray-2160p:
            min: 102
            max: 2000
            preferred: 1999
          Remux-2160p:
            min: 187.4
            max: 2000
            preferred: 1999
