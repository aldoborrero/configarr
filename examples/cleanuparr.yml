# Cleanuparr example — settings sections, download clients and *arr instances.
#
# Keys are snake_case (mapped onto Cleanuparr's camelCase API). Settings sections
# are merged over Cleanuparr's current values, so set only what you want to pin.

cleanuparr:
  instances:
    main:
      base_url: http://localhost:11011
      api_key: ${CLEANUPARR_API_KEY}

      general:
        dry_run: false

      queue_cleaner:
        enabled: true
        failed_import:
          max_strikes: 3

      malware_blocker:
        enabled: true
        sonarr:
          enabled: true
        radarr:
          enabled: true

      download_clients:
        Transmission:
          type: transmission
          host: http://transmission:9091
          url_base: /transmission/
          seeding_rules:
            cleanup-imported:
              categories: [sonarr, radarr]
              max_ratio: 1
              max_seed_time: 48
        SABnzbd:
          type: sabnzbd
          host: http://sabnzbd:8080
          api_key: ${SABNZBD_API_KEY}
          orphaned_files:
            enabled: true
            scan_directories: [/downloads/complete]
            orphaned_directory: /downloads/orphaned
            min_file_age_hours: 48
            purge_after_hours: 168

      arr:
        sonarr:
          instances:
            Sonarr:
              url: http://sonarr:8989
              api_key: ${SONARR_API_KEY}
              version: 4
        radarr:
          instances:
            Radarr:
              url: http://radarr:7878
              api_key: ${RADARR_API_KEY}
              version: 6
